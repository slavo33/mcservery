name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, testy a build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Inštalácia závislostí
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: TypeScript kontrola
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Jednotkové a integračné testy
        run: bun run test

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

  performance:
    name: Lighthouse ${{ matrix.form_factor }} (LCP/CLS rozpočet)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        form_factor: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inštalácia závislostí
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Zoznam URL pre Lighthouse (vrátane detailu s najdlhším popisom)
        run: bunx tsx scripts/lighthouse-urls.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Lighthouse CI (${{ matrix.form_factor }} throttling profil)
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.cjs
        env:
          LH_FORM_FACTOR: ${{ matrix.form_factor }}

      - name: Zhrnutie Lighthouse reportov
        if: always()
        run: |
          {
            echo "## Lighthouse reporty (${{ matrix.form_factor }})"
            echo ""
            echo "Throttling profil: **${{ matrix.form_factor }}** (konzistentný CPU aj sieťový throttling)."
            echo ""
            echo "| Report | Typ |"
            echo "| --- | --- |"
            for f in $(find .lighthouseci -type f \( -name '*.html' -o -name '*.json' \) | sort); do
              echo "| \`$(basename "$f")\` | ${f##*.} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lighthouse HTML reporty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-html-reports-${{ matrix.form_factor }}
          path: |
            .lighthouseci/**/*.html
          if-no-files-found: warn
          retention-days: 30

      - name: Lighthouse JSON reporty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-json-reports-${{ matrix.form_factor }}
          path: |
            .lighthouseci/**/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Lighthouse kompletný výstup (vrátane assertion logov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-raw-${{ matrix.form_factor }}
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

  performance-compare:
    name: Lighthouse porovnanie mobile vs. desktop
    runs-on: ubuntu-latest
    needs: performance
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Stiahnutie mobile reportov
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-json-reports-mobile
          path: lh-artifacts/mobile
        continue-on-error: true

      - name: Stiahnutie desktop reportov
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-json-reports-desktop
          path: lh-artifacts/desktop
        continue-on-error: true

      - name: Porovnanie reportov
        run: bunx tsx scripts/lighthouse-compare.ts
        env:
          LH_MOBILE_DIR: lh-artifacts/mobile/reports/mobile
          LH_DESKTOP_DIR: lh-artifacts/desktop/reports/desktop

      - name: Artefakt porovnania
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-comparison
          path: |
            .lighthouseci/comparison.json
            .lighthouseci/comparison.md
          if-no-files-found: warn
          retention-days: 30

  e2e:
    name: E2E (manuálne)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inštalácia závislostí
        run: |
          bun install --frozen-lockfile
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Štart dev servera
        run: |
          bun run dev &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 2; done
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: E2E test verzie 26.2
        run: python3 e2e/version_26_2_e2e.py
        env:
          LOVABLE_BROWSER_SUPABASE_STORAGE_KEY: ${{ secrets.E2E_SUPABASE_STORAGE_KEY }}
          LOVABLE_BROWSER_SUPABASE_SESSION_JSON: ${{ secrets.E2E_SUPABASE_SESSION_JSON }}

      - name: E2E konzistencia VersionBadge ↔ JSON-LD
        run: python3 e2e/version_jsonld_consistency_e2e.py
        env:
          LOVABLE_BROWSER_SUPABASE_STORAGE_KEY: ${{ secrets.E2E_SUPABASE_STORAGE_KEY }}
          LOVABLE_BROWSER_SUPABASE_SESSION_JSON: ${{ secrets.E2E_SUPABASE_SESSION_JSON }}

      - name: E2E sitemap.xml a robots.txt
        run: python3 e2e/sitemap_robots_e2e.py
        env:
          LOVABLE_BROWSER_SUPABASE_STORAGE_KEY: ${{ secrets.E2E_SUPABASE_STORAGE_KEY }}
          LOVABLE_BROWSER_SUPABASE_SESSION_JSON: ${{ secrets.E2E_SUPABASE_SESSION_JSON }}

      - name: E2E validácia formátu sitemapy
        run: python3 e2e/sitemap_format_e2e.py

      - name: E2E indexovateľnosť sitemapy (200, žiadny noindex)
        run: python3 e2e/sitemap_indexability_e2e.py

      - name: E2E čerstvosť sitemapy (lastmod po úprave profilu)
        run: python3 e2e/sitemap_freshness_e2e.py
        env:
          E2E_SUPABASE_ACCESS_TOKEN: ${{ secrets.E2E_SUPABASE_ACCESS_TOKEN }}

      - name: E2E presmerovania URL zo sitemapy (bez cyklov a 404)
        run: python3 e2e/sitemap_redirects_e2e.py

      - name: E2E responzívne rozloženie a vizuálna regresia profilu
        run: python3 e2e/profile_responsive_visual_e2e.py

      - name: E2E obrázky a GIF na profiloch (200 + zobrazenie)
        run: python3 e2e/profile_images_e2e.py

      - name: E2E hlavičky sitemapy (Content-Type, status, caching)
        run: python3 e2e/sitemap_headers_e2e.py

      - name: E2E canonical a robots meta (self-referencing, bez noindex)
        run: python3 e2e/canonical_indexability_e2e.py

      - name: E2E detekcia soft-404 stránok
        run: python3 e2e/soft_404_e2e.py

      - name: E2E OpenGraph/Twitter meta tagy a dostupnosť og:image
        run: python3 e2e/og_meta_e2e.py

      - name: E2E robots.txt, sitemap odkaz a noindex konzistencia
        run: python3 e2e/robots_indexability_e2e.py

      - name: E2E vizuálna regresia hlavných rozložení
        run: python3 e2e/layout_visual_regression_e2e.py

      - name: E2E OpenGraph/Twitter meta tagy na profiloch serverov
        run: python3 e2e/og_server_detail_e2e.py

      - name: E2E Schema.org JSON-LD na verejných stránkach
        run: python3 e2e/jsonld_structured_data_e2e.py

      - name: E2E povinné polia JSON-LD a konzistencia údajov servera
        run: python3 e2e/jsonld_fields_consistency_e2e.py

      - name: E2E responzívny render (mobil/tablet/desktop, overflow)
        run: python3 e2e/responsive_overflow_e2e.py

      - name: E2E bezpečnostné HTTP hlavičky verejných stránok
        run: python3 e2e/security_headers_e2e.py

      - name: E2E favicon a web manifest
        run: python3 e2e/favicon_manifest_e2e.py

      - name: E2E vyhľadávanie a filtre serverov
        run: python3 e2e/servers_filters_e2e.py

      - name: E2E vyhľadávanie a stránkovanie na mobile
        run: python3 e2e/servers_search_pagination_mobile_e2e.py

      - name: E2E dostupnosť formulára a detailu servera
        run: python3 e2e/a11y_forms_detail_e2e.py

      - name: E2E rozloženie detailu servera
        run: python3 e2e/server_detail_sections_e2e.py

      - name: E2E vytvorenie servera, nahrávanie médií a lajkovanie
        run: python3 e2e/server_create_media_e2e.py

      - name: E2E breadcrumbs JSON-LD vs viditeľná navigácia
        run: python3 e2e/breadcrumbs_jsonld_e2e.py

      - name: E2E pokrytie sitemapy (všetky indexovateľné URL)
        run: python3 e2e/sitemap_coverage_e2e.py

      - name: E2E sitemap po vytvorení a editácii profilu
        run: python3 e2e/sitemap_profile_update_e2e.py
        env:
          LOVABLE_BROWSER_SUPABASE_STORAGE_KEY: ${{ secrets.E2E_SUPABASE_STORAGE_KEY }}
          LOVABLE_BROWSER_SUPABASE_SESSION_JSON: ${{ secrets.E2E_SUPABASE_SESSION_JSON }}





      - name: E2E dostupnosť (axe-core)
        run: python3 e2e/accessibility_axe_e2e.py

      - name: Report dostupnosti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: e2e/a11y-report.json

      - name: Screenshoty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore
